[package]
name = "vfs"
description = "A byte- and path-oriented filesystem view: native directories, in-memory archives, and (later) browser storage."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
zip.workspace = true

# The browser backend (`src/opfs.rs`): a project in the Origin Private File System,
# via `web-sys`. Native builds are untouched.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "File",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "Navigator",
    "StorageManager",
    "Window",
    "WritableStream",
] }
