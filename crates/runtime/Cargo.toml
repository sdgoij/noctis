[package]
name = "runtime"
description = "Game runtime/export loop for the Noctis engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The crate ships one binary: `noctis-game`, the stripped game runtime an export
# copies. Development runs and builds go through the `noctis` tool (crates/noctis),
# which drives this crate's library.

[features]
# Run JavaScript in a game: forwards to the `script` crate's real backend. Slag
# ships a transitive crate that is also named `runtime`, so prefer the manifest
# path when enabling it: `cargo build --manifest-path crates/runtime/Cargo.toml
# --features slag`.
slag = ["script/slag"]

[[bin]]
name = "noctis-game"
path = "src/main.rs"

[dependencies]
math.workspace = true
ecs.workspace = true
render.workspace = true
physics.workspace = true
audio.workspace = true
script.workspace = true
platform.workspace = true
project.workspace = true
serde_json.workspace = true
log.workspace = true
