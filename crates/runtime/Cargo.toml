[package]
name = "runtime"
description = "Game runtime/export loop for the Noctis engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
# Run JavaScript in a game: forwards to the `script` crate's real backend.
# `cargo test -p runtime --features slag`
slag = ["script/slag"]

[[bin]]
name = "noctis-runtime"
path = "src/main.rs"

[dependencies]
math.workspace = true
ecs.workspace = true
render.workspace = true
physics.workspace = true
audio.workspace = true
script.workspace = true
platform.workspace = true
project.workspace = true
serde_json.workspace = true
log.workspace = true
