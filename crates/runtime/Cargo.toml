[package]
name = "runtime"
description = "Game runtime/export loop for the Noctis engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# The crate ships two binaries: the game runtime and the `noctis` project tool.
# Defaulting `cargo run -p runtime` to the runtime keeps the common commands
# short; the tool is still `cargo run -p runtime --bin noctis -- ...`.
default-run = "noctis-runtime"

[features]
# Run JavaScript in a game: forwards to the `script` crate's real backend.
# With the feature on, `-p runtime` is ambiguous (Slag ships a transitive crate
# named `runtime`), so use the manifest path:
# `cargo test --manifest-path crates/runtime/Cargo.toml --features slag`
slag = ["script/slag"]

[[bin]]
name = "noctis-runtime"
path = "src/main.rs"

[[bin]]
name = "noctis"
path = "src/bin/noctis.rs"

[dependencies]
math.workspace = true
ecs.workspace = true
render.workspace = true
physics.workspace = true
audio.workspace = true
script.workspace = true
platform.workspace = true
project.workspace = true
serde_json.workspace = true
log.workspace = true
