[package]
name = "web"
description = "The Noctis browser client: a wasm entry point that runs a project bundle on a <canvas>."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# A browser artifact: a `cdylib` for wasm-bindgen, and an `rlib` so a host can
# still depend on it. The whole crate is `cfg(target_arch = "wasm32")`, so a
# native build of the workspace compiles an empty library (and no deps).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["entry"]
# The stock `#[wasm_bindgen] start` entry (the no-Rust client). A project that
# carries Rust generates its own entry and depends on this crate with
# `default-features = false`, so only one `start` export exists in a module.
entry = []
# The browser **editor** entry (`start_editor`), which pulls in `crates/editor`. Off
# by default: the client does not pay for the editor.
editor = ["dep:editor"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
runtime.workspace = true
project.workspace = true
vfs.workspace = true
platform.workspace = true
ecs.workspace = true
script.workspace = true
editor = { workspace = true, optional = true }
log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Response", "Window", "console"] }
