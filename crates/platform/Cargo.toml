[package]
name = "platform"
description = "Window and event-loop host for the Noctis engine (winit)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
math.workspace = true
ecs.workspace = true
render.workspace = true
wgpu.workspace = true
egui.workspace = true
log.workspace = true

# The native host is winit + egui-winit + egui-wgpu. egui-winit's OS clipboard
# bridge (`arboard`) and its `DroppedFile` impl do not build for
# `wasm32-unknown-unknown` (see the web host below), so they are native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true

# The web host (crates/platform/src/web.rs): a `<canvas>` and a
# requestAnimationFrame loop driven through `web-sys`, not winit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "Performance",
    "WheelEvent",
    "Window",
    "console",
] }
