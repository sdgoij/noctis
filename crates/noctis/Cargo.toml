[package]
name = "noctis"
description = "The Noctis engine: the multicall `noctis` tool and the embedding facade."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

# `noctis` is the default binary, so a bare `cargo run -- editor` opens the
# editor (the workspace root sets `default-members = ["crates/noctis"]`).
default-run = "noctis"

[[bin]]
name = "noctis"
path = "src/main.rs"

[features]
default = ["editor"]
# The editor and its authoring UI (winit/egui/wgpu), plus the `noctis editor`
# command. A game client built for a Rust project links only the runtime and
# the plugin, so it depends on `noctis` with `default-features = false` and this
# stays off — a shipped plugin game carries no authoring tools.
editor = ["dep:editor"]

[dependencies]
audio.workspace = true
ecs.workspace = true
editor = { workspace = true, optional = true }
math.workspace = true
physics.workspace = true
project.workspace = true
render.workspace = true
runtime.workspace = true
script.workspace = true
serde.workspace = true
