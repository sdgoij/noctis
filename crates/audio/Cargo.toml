[package]
name = "audio"
description = "Audio playback and spatialization for the Noctis engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
math.workspace = true
ecs.workspace = true
rodio.workspace = true

# getrandom (reached through rodio → rand_distr → rand) needs its `wasm_js`
# backend enabled to build for `wasm32-unknown-unknown`; `.cargo/config.toml`
# selects the matching backend cfg. Native builds do not need this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# The WebAudio backend (`src/web.rs`): an `AudioContext` behind the engine's sink API.
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioContext",
    "AudioDestinationNode",
    "AudioNode",
    "AudioParam",
    "AudioScheduledSourceNode",
    "BaseAudioContext",
    "EventTarget",
    "GainNode",
    "StereoPannerNode",
    "Window",
] }
