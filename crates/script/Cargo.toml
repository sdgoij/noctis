[package]
name = "script"
description = "JavaScript scripting host for the Noctis engine (Slag backend)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# The real JavaScript backend. Off by default: Slag pulls a from-scratch WASM
# engine and a very large pinned `test262` submodule, which the ordinary engine
# build does not want. Build the backend with `cargo build -p script --features slag`.
slag = ["dep:slag"]

[dependencies]
math.workspace = true
ecs.workspace = true
serde_json.workspace = true

# Optional: the Slag JavaScript engine. `default-features = false` avoids the
# default-on WASM/JIT surface; the engine still needs its `test262` submodule at
# build time (see the crate docs).
slag = { git = "https://github.com/sdgoij/slag", package = "slag", default-features = false, optional = true }
