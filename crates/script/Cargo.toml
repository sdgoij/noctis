[package]
name = "script"
description = "JavaScript scripting host for the Noctis engine (Slag backend)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
math.workspace = true
ecs.workspace = true
serde_json.workspace = true
log.workspace = true

# The Slag JavaScript engine. It is the engine's scripting backend, so it is a
# plain dependency rather than a feature: enabling its WebAssembly JS API (`wasm`)
# and Cranelift JIT hook (`jit`) is how scripts see the `WebAssembly` global and
# hot bodies run at machine speed.
slag = { git = "https://github.com/sdgoij/slag", package = "slag", default-features = false, features = ["wasm", "jit"] }

[dev-dependencies]
serde.workspace = true
