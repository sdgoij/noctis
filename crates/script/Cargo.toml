[package]
name = "script"
description = "JavaScript scripting host for the Noctis engine (Slag backend)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
math.workspace = true
ecs.workspace = true
serde_json.workspace = true
log.workspace = true

# The Slag JavaScript engine, the engine's scripting backend (a workspace
# dependency). The `wasm` JS WebAssembly API is on everywhere; the Cranelift
# `jit` hook is native-only — it does not build for wasm, where scripts run on
# the interpreter.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slag = { workspace = true, features = ["jit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
slag = { workspace = true }

[dev-dependencies]
serde.workspace = true
