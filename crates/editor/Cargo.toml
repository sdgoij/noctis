[package]
name = "editor"
description = "Scene editor and AI-controllable authoring API for the Noctis engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
math.workspace = true
ecs.workspace = true
render.workspace = true
platform.workspace = true
testscene.workspace = true
project.workspace = true
extensions.workspace = true
vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The Slag JavaScript engine, for editor extensions (`noctis` global). It shares
# the workspace's `slag` spec and adds the native JIT hook (executable memory,
# via Cranelift/`region`), which cannot link on the web — so the wasm build takes
# the interpreter only (see the `target_arch = "wasm32"` section below).
slag = { workspace = true, features = ["jit"] }

# `--watch`: reload extensions when their files change (native only).
notify.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Slag on the web: the interpreter, no JIT hook.
slag.workspace = true

[dev-dependencies]
image.workspace = true
