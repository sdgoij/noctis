[package]
name = "editor"
description = "Scene editor and AI-controllable authoring API for the Noctis engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
math.workspace = true
ecs.workspace = true
render.workspace = true
platform.workspace = true
testscene.workspace = true
project.workspace = true
extensions.workspace = true
vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true

# The Slag JavaScript engine, for editor extensions (`noctis` global). Matched to
# the `script` crate's feature set so the dependency graph unifies.
slag = { git = "https://github.com/sdgoij/slag", package = "slag", default-features = false, features = ["wasm", "jit"] }

# `--watch`: reload extensions when their files change.
notify.workspace = true

[dev-dependencies]
image.workspace = true
