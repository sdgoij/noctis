[workspace]
# `resolver = "2"` is used deliberately: the 2024 edition's default resolver
# ("3") is not understood by some rust-analyzer builds, which then fail with
# "unable to load the workspace". Resolver 2 is universally supported and the
# difference is immaterial for this dependency graph.
resolver = "2"
members = [
    "crates/math",
    "crates/ecs",
    "crates/ecs-macros",
    "crates/render",
    "crates/physics",
    "crates/audio",
    "crates/script",
    "crates/testscene",
    "crates/project",
    "crates/extensions",
    "crates/vfs",
    "crates/editor",
    "crates/runtime",
    "crates/platform",
    "crates/web",
    "crates/noctis",
    "crates/client",
]

# `cargo run -- editor` (and friends) must resolve to the `noctis` tool without a
# `-p`, so it is the sole default member. Everything else is still covered by
# `cargo test --workspace`.
default-members = ["crates/noctis"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
authors = ["Noctis Engine Contributors"]
repository = "https://github.com/noctis-engine/noctis"

[workspace.dependencies]
math = { path = "crates/math" }
ecs = { path = "crates/ecs" }
ecs-macros = { path = "crates/ecs-macros" }
render = { path = "crates/render" }
physics = { path = "crates/physics" }
audio = { path = "crates/audio" }
script = { path = "crates/script" }
testscene = { path = "crates/testscene" }
project = { path = "crates/project" }
extensions = { path = "crates/extensions" }
vfs = { path = "crates/vfs" }
editor = { path = "crates/editor" }
runtime = { path = "crates/runtime" }
platform = { path = "crates/platform" }
web = { path = "crates/web" }
noctis = { path = "crates/noctis" }
client = { path = "crates/client" }

# Scripting: the Slag JavaScript engine, pinned to a revision (a bump is a
# one-line change here, and cargo re-resolves it everywhere — the engine
# workspace and the generated `.noctis/*` client crates). The `wasm` JS
# WebAssembly API is on everywhere; the Cranelift `jit` hook is native-only — it
# does not build for wasm, so the target crates that want it add the feature
# (see `crates/script`).
slag = { git = "https://github.com/sdgoij/slag", rev = "e0d2b847410189b9944f70b1be6984c920efea8f", package = "slag", default-features = false, features = ["wasm"] }

# Math
glm = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Derive macros
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive"] }

# Graphics
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
gltf = "1.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "tga", "bmp"] }
pollster = "0.4"

# Text
ab_glyph = "0.2"

# Physics
rapier3d = "0.36"

# Audio
rodio = "0.22"

# Windowing
winit = "0.30"

# Web (wasm32) host: canvas, requestAnimationFrame, DOM events
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# UI
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false, features = ["winit"] }
egui-winit = "0.36"

# Logging
log = "0.4"

# Filesystem watching (development script hot reload)
notify = "8"

# Editor-extension archives (.zip). Store + deflate only: that covers ordinary
# archives without pulling in the bzip2/zstd/lzma/crypto trees.
zip = { version = "9", default-features = false, features = ["deflate"] }
