# getrandom 0.3+ refuses to build for `wasm32-unknown-unknown` unless a backend is
# selected explicitly. `audio` enables getrandom's `wasm_js` feature (it reaches us
# through rodio → rand_distr → rand); this picks the matching backend for the
# target. Native builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"']
