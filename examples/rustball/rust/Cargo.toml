# The project's Rust plugin.
#
# `noctis` is depended on without the `editor` feature: a shipped game links this
# crate, and it must not carry the editor or its authoring UI.
[package]
name = "rustball"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
noctis = { path = "../../../crates/noctis", default-features = false }
serde = { version = "1", features = ["derive"] }

# Detach from the engine workspace. The plugin builds in its own target directory
# here, and is compiled into the generated `.noctis/` tool and client crates.
[workspace]
