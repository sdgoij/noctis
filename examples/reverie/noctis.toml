# Reverie Amidst Ruins — a port of Dave Eddy's terminal platformer
# (github.com/bahamas10/reverie-amidst-ruins, MIT) to a Noctis window.
#
# The project carries Rust: `Cargo.toml` + `src/lib.rs` is a plugin that runs the
# original game — vendored almost verbatim under `src/game/` — and publishes each
# frame it renders, which the window presents in place of the scene. The scene
# below is therefore a placeholder; the plugin draws every pixel.

[project]
name = "Reverie Amidst Ruins"
version = "0.2.0"
description = "A 2D platformer, ported from the terminal to a Noctis window."
# The original game's author and source — the web page this is built into shows
# them as a credit, so a playable build links back.
authors = ["Dave Eddy (bahamas10)"]
homepage = "https://github.com/bahamas10/reverie-amidst-ruins"

[project.settings]
# The plugin renders its own frame; the scene is only there to be loaded.
default_scene = "scenes/main.scene.json"
mode = "2d"
# The game integrates its own gravity, so the engine's is zero.
gravity = [0.0, 0.0, 0.0]

[window]
title = "Reverie Amidst Ruins"
width = 720
height = 540

[render]
hdr = false
sample_count = 1

[[scene]]
path = "scenes/main.scene.json"
name = "Reverie"

[[build]]
name = "reverie"
scene = "scenes/main.scene.json"
