# Goats — a Noctis port of the Slag Goat sandbox (`goats/`).
#
# The project root is its plugin crate (a `Cargo.toml` and `src/lib.rs`, whose type
# is marked `#[noctis::plugin]`). M0 loads the goat model and the terrain and drives
# an orbit camera; see README.md and .notes/goats.md for the design.

[project]
name = "Goats"
version = "0.1.0"
description = "A Noctis port of the Slag Goat sandbox — M0, the render-path spike."

[project.settings]
default_scene = "scenes/meadow.scene.json"
mode = "3d"
gravity = [0.0, -9.81, 0.0]

[window]
title = "Goats (M0)"
width = 1280
height = 720

[render]
# The HDR pipeline and 4x MSAA, and the sky the image-based lighting is
# precomputed from. The engine's fallback (no environment) is a fully white,
# fully-lit sky, which overexposes pale materials — the goat came out flat white.
# The meadow sky gives a moderate ambient instead; the directional sun lights the
# scene on top.
hdr = true
sample_count = 4
environment = "assets/hdris/meadow.hdr"
