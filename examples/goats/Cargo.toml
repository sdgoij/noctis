# Goats — a Noctis port of the Slag Goat sandbox (`goats/`).
#
# The project is a cargo workspace. `noctis` finds a project's Rust through the
# root `Cargo.toml`, so a virtual workspace names its plugin crate as the first
# default member: the plugin (`crates/plugin`, a `#[noctis::plugin]`) drives the
# simulation (`crates/goats`). See README.md and .notes/goats.md for the design.
[workspace]
# Edition 2024's resolver ("3") is not understood by some rust-analyzer builds;
# resolver 2 is universally supported and immaterial for this dependency graph.
resolver = "2"
members = ["crates/plugin", "crates/goats"]
default-members = ["crates/plugin", "crates/goats"]
