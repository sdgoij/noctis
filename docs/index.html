<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noctis demos</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0d10;
        color: #8a93a0;
        font: 13px/1.4 ui-monospace, monospace;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid #1c2128;
      }
      label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      select {
        background: #12161c;
        color: inherit;
        border: 1px solid #2a323c;
        border-radius: 6px;
        padding: 5px 8px;
        font: inherit;
      }
      a {
        color: #4c8dff;
        margin-left: auto;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <!--
      The Noctis demo chooser (served by GitHub Pages). Each demo is its own
      self-contained build under `docs/<project>/` — `index.html`, the wasm-bindgen
      glue + module, `env.js`, and `game.zip` — because a project that carries Rust
      needs the *plugin-linked* module, not the stock one. The iframe swaps between
      them; `?p=<project>` deep-links.
    -->
    <header>
      <label>
        Demo
        <select id="project">
          <option value="showcase">Showcase — JavaScript gameplay</option>
          <option value="rustball">Rust Ball — Rust plugin</option>
        </select>
      </label>
      <a id="open" href="showcase/index.html">open in a tab →</a>
    </header>
    <iframe id="frame" src="showcase/index.html" title="Noctis demo"></iframe>
    <script>
      const frame = document.getElementById("frame");
      const open = document.getElementById("open");
      const select = document.getElementById("project");
      const load = () => {
        const url = select.value + "/index.html";
        frame.src = url;
        open.href = url;
      };
      select.addEventListener("change", load);
      // A deep link (?p=rustball) preselects a demo.
      const picked = new URLSearchParams(location.search).get("p");
      if (picked) {
        select.value = picked;
      }
      load();
    </script>
  </body>
</html>
